name: "02 · Trusted Build and Publish"

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: "Validate · Build once · Push GHCR"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Validate before privileged publish
        run: npm run check
      - name: Authenticate with short-lived GitHub token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build once and push to GHCR
        id: digest
        run: |
          repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository"
          tag="sha-$GITHUB_SHA"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image:$tag" .
          docker push "$image:$tag"
          immutable=$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')
          case "$immutable" in
            *@sha256:*) ;;
            *) echo "No registry digest available: $immutable"; exit 1 ;;
          esac
          {
            echo "image=$immutable"
            echo "name=$image"
            echo "sha256=${immutable#*@}"
          } >> "$GITHUB_OUTPUT"
          echo "## Release image" >> "$GITHUB_STEP_SUMMARY"
          echo "$immutable" >> "$GITHUB_STEP_SUMMARY"
      - name: G23 · Sigstore-backed SLSA image provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.digest.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.sha256 }}
          push-to-registry: true
          # Personal-account repo, not organization-owned: disable optional record.
          create-storage-record: false
      - name: G23 · Independently verify registry attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.digest.outputs.image }}
        run: gh attestation verify "oci://$IMAGE" -R "$GITHUB_REPOSITORY"

  image-security:
    name: "G21 · Scan published immutable digest before promotion"
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate to GHCR (read-only)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Prepare G21 evidence directory
        run: mkdir -p reports
      - name: Scan exact published digest, fail on fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.publish.outputs.image }}
          scanners: vuln
          format: json
          output: reports/trivy-release.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Preserve release scanner evidence even if promotion is blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g21-release-image-cve-report
          path: reports/trivy-release.json
          if-no-files-found: warn
          retention-days: 14

  staging-smoke:
    name: "Staging simulation · Same immutable digest"
    needs: [publish, image-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Pull exact digest and smoke-test it locally
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "Mutable tag forbidden"; exit 1 ;;
          esac
          docker pull "$IMAGE"
          docker run -d --name staging-demo -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs staging-demo || true; docker stop staging-demo || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo "## Staging simulation" >> "$GITHUB_STEP_SUMMARY"
              echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          exit 1
  staging-kind:
    name: "G29 · Actual kind staging deployment"
    needs: [publish, image-security]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      image: ${{ needs.publish.outputs.image }}
      environment: demo-staging

  promotion-kind:
    name: "G24 · Promote staging digest to isolated kind (NOT real production)"
    needs: [publish, image-security, staging-smoke, staging-kind]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      # Pass the SUCCESSFUL staging deployment's recorded digest, not a tag
      # or a second build result. This is an ephemeral second kind cluster.
      image: ${{ needs.staging-kind.outputs.deployed_image }}
      environment: demo-promotion-kind

  promotion-evidence:
    name: "G24 · Verify both kind environments received identical digest"
    needs: [publish, staging-kind, promotion-kind]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare actual staging and promotion outputs
        env:
          PUBLISHED: ${{ needs.publish.outputs.image }}
          STAGING: ${{ needs.staging-kind.outputs.deployed_image }}
          PROMOTED: ${{ needs.promotion-kind.outputs.deployed_image }}
        run: |
          case "$PUBLISHED" in
            *@sha256:*) ;;
            *) echo "G24: release image was not immutable" >&2; exit 1 ;;
          esac
          test "$PUBLISHED" = "$STAGING"
          test "$STAGING" = "$PROMOTED"
          mkdir -p reports
          node -e '
            const { writeFileSync } = require("node:fs");
            const image = process.env.PUBLISHED;
            const report = {
              source: "GITHUB_REAL_TWO_EPHEMERAL_KIND_CLUSTERS",
              releaseSha: process.env.GITHUB_SHA,
              runId: process.env.GITHUB_RUN_ID,
              published: image,
              staging: process.env.STAGING,
              promotion: process.env.PROMOTED,
              immutableDigestMatches: true,
              nativeApproval: false,
              productionDeployment: false,
              timestamp: new Date().toISOString()
            };
            writeFileSync("reports/promotion.json", JSON.stringify(report, null, 2) + "\n");
          '
          echo "G24: immutable digest matches across publish, staging and second kind cluster" >> "$GITHUB_STEP_SUMMARY"
          echo "This is an approval-free teaching rehearsal, not production." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve stage-to-promotion identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g24-two-kind-promotion-evidence
          path: reports/promotion.json
          if-no-files-found: warn
          retention-days: 14
