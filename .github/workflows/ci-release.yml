name: "02 · Trusted Build and Publish"

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: "Validate · Build once · Push GHCR"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Validate before privileged publish
        run: npm run check
      - name: Authenticate with short-lived GitHub token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build once and push to GHCR
        id: digest
        run: |
          repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository"
          tag="sha-$GITHUB_SHA"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image:$tag" .
          docker push "$image:$tag"
          immutable=$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')
          case "$immutable" in
            *@sha256:*) ;;
            *) echo "No registry digest available: $immutable"; exit 1 ;;
          esac
          {
            echo "image=$immutable"
            echo "name=$image"
            echo "sha256=${immutable#*@}"
          } >> "$GITHUB_OUTPUT"
          echo "## Release image" >> "$GITHUB_STEP_SUMMARY"
          echo "$immutable" >> "$GITHUB_STEP_SUMMARY"
      - name: G23 · Sigstore-backed SLSA image provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.digest.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.sha256 }}
          push-to-registry: true
          # Personal-account repo, not organization-owned: disable optional record.
          create-storage-record: false
      - name: G23 · Independently verify registry attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.digest.outputs.image }}
        run: gh attestation verify "oci://$IMAGE" -R "$GITHUB_REPOSITORY"

  staging-smoke:
    name: "Staging simulation · Same immutable digest"
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Pull exact digest and smoke-test it locally
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "Mutable tag forbidden"; exit 1 ;;
          esac
          docker pull "$IMAGE"
          docker run -d --name staging-demo -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs staging-demo || true; docker stop staging-demo || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo "## Staging simulation" >> "$GITHUB_STEP_SUMMARY"
              echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          exit 1
  staging-kind:
    name: "G29 · Actual kind staging deployment"
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      image: ${{ needs.publish.outputs.image }}
      environment: demo-staging
