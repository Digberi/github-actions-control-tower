name: "09 · Trivy Image Vulnerability Scan"

on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        description: "Immutable GHCR image; default is a previously green snapshot, not necessarily newest"
        required: true
        default: "ghcr.io/digberi/github-actions-control-tower@sha256:95d3570680bc7cdb2030ab9b05019a3b5f75eda3e6fe8b4532591a3c26bf7189"
  schedule:
    # Re-scan a known immutable snapshot for vulnerability-database drift.
    # ci-release.yml separately scans EVERY newly published digest before deploy.
    - cron: "43 3 * * 2"

permissions:
  contents: read
  packages: read

jobs:
  trivy:
    name: "G21 · Re-scan pinned immutable image for new CVEs"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate with short-lived GitHub token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify target is an immutable GHCR digest
        env:
          IMAGE: ${{ inputs.image || 'ghcr.io/digberi/github-actions-control-tower@sha256:95d3570680bc7cdb2030ab9b05019a3b5f75eda3e6fe8b4532591a3c26bf7189' }}
        run: |
          node scripts/k8s-render.mjs "$IMAGE" > /dev/null
          mkdir -p reports
          echo "Scanning image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image || 'ghcr.io/digberi/github-actions-control-tower@sha256:95d3570680bc7cdb2030ab9b05019a3b5f75eda3e6fe8b4532591a3c26bf7189' }}
          scanners: vuln
          format: json
          output: reports/trivy.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-image-cve-report
          path: reports/trivy.json
          if-no-files-found: warn
          retention-days: 7
