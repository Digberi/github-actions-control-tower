name: "01 · PR Quality Gates"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: "G01 · actionlint (real YAML/action semantics)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint every workflow with official actionlint container
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11 -color

  static:
    name: "Syntax · Architecture · Contract · Secrets · Workflow policy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:syntax
      - run: npm run check:architecture
      - run: npm run check:contract
      - run: npm run check:secrets
      - run: npm run check:workflows
      - name: G20 · Validate actual K8s deployment security policy
        run: CHECK_REAL_K8S_MANIFEST=true node scripts/heavy-gates.mjs G20 green

  policy:
    name: "G19/G20/G24/G26/G27 · ${{ matrix.gate }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [G13, G19, G20, G24, G26, G27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run narrow policy with controlled fixture
        env:
          GATE: ${{ matrix.gate }}
        run: node scripts/heavy-gates.mjs "$GATE" green

  supply_chain:
    name: "G18/G22 · SCA audit and real CycloneDX SBOM"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: G18 · Actual npm vulnerability database check (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: G22 · Produce machine-readable dependency inventory
        run: |
          mkdir -p reports
          npm sbom --sbom-format cyclonedx > reports/sbom.cdx.json
          node scripts/verify-sbom.mjs < reports/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cyclonedx-sbom
          path: reports/sbom.cdx.json
          retention-days: 7

  postgres:
    name: "G08 · Real PostgreSQL transactions and idempotency"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-demo-only
          POSTGRES_DB: orders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d orders"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ci:ci-demo-only@127.0.0.1:5432/orders
      PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:postgres

  consumer:
    name: "G11 · Independent HTTP consumer compatibility"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:consumer

  unit:
    name: "Unit · Node ${{ matrix.node }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit

  coverage:
    name: "G06 · Unit coverage threshold ≥80%"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check:coverage

  integration:
    name: "Integration · Real HTTP"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  e2e:
    name: "E2E · Order lifecycle"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e

  performance:
    name: "Performance · HTTP p95"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check:performance

  image:
    name: "Container · Build and smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag ci-demo:pr .
      - name: Boot container and verify health
        run: |
          docker run -d --name ci-demo -p 127.0.0.1:3000:3000 ci-demo:pr
          trap 'docker logs ci-demo || true; docker stop ci-demo || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  security:
    name: "G16/G19 · Real Security (reusable)"
    permissions:
      contents: read
    uses: ./.github/workflows/security-real.yml
    with:
      gate: all
      mode: green

  iac:
    name: "G20 · Trivy IaC (reusable)"
    permissions:
      contents: read
    uses: ./.github/workflows/trivy-iac.yml
    with:
      mode: green

  property:
    name: "G05 · Seeded property fuzz and safe-integer invariants"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Run seeded property suite with captured TAP evidence
        run: |
          mkdir -p reports
          set -o pipefail
          npm run test:property | tee reports/property-tests.tap
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: property-based-test-tap
          path: reports/property-tests.tap
          if-no-files-found: warn
          retention-days: 14

  required:
    name: "Required · PR Gate"
    if: always()
    needs: [actionlint, static, policy, supply_chain, postgres, consumer, unit, coverage, integration, e2e, performance, image, security, iac, property]
    runs-on: ubuntu-latest
    steps:
      - name: Collect outcomes and enforce required checks
        env:
          STATIC: ${{ needs.static.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          POLICY: ${{ needs.policy.result }}
          SUPPLY_CHAIN: ${{ needs.supply_chain.result }}
          POSTGRES: ${{ needs.postgres.result }}
          CONSUMER: ${{ needs.consumer.result }}
          UNIT: ${{ needs.unit.result }}
          COVERAGE: ${{ needs.coverage.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          IMAGE: ${{ needs.image.result }}
          SECURITY: ${{ needs.security.result }}
          IAC: ${{ needs.iac.result }}
          PROPERTY: ${{ needs.property.result }}
        run: |
          echo "## PR Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          printf '| Job | Result |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for job in ACTIONLINT STATIC POLICY SUPPLY_CHAIN POSTGRES CONSUMER UNIT COVERAGE INTEGRATION E2E PERFORMANCE IMAGE SECURITY IAC PROPERTY; do
            result="${!job}"
            printf '| %s | %s |\n' "$job" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"
