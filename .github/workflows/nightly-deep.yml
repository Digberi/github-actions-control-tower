name: "05 · Scheduled Deep Checks"

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nightly-deep.yml"
      - "scripts/soak.mjs"
      - "scripts/mutation-proof.mjs"
      - "tests/property.test.mjs"
      - "src/domain.mjs"

permissions:
  contents: read

jobs:
  deep:
    name: "Dependency audit · Coverage · Regression"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit coverage report (informational, not threshold gate)
        run: node --experimental-test-coverage --test tests/unit.test.mjs
      - run: npm run check:performance

  fuzz-mutation:
    name: "Nightly · 3000-seed property invariants + controlled mutation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Genuine seeded property fuzz
        run: npm run test:property
      - name: Kill one controlled arithmetic mutant
        run: npm run nightly:mutation
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-mutation-evidence
          path: reports/mutation-proof.json
          if-no-files-found: warn
          retention-days: 14

  soak:
    name: "Nightly · Actual concurrent HTTP soak and p95"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Real 20-second six-client POST+GET consistency soak
        run: npm run nightly:soak
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-http-soak-evidence
          path: reports/http-soak.json
          if-no-files-found: warn
          retention-days: 14
