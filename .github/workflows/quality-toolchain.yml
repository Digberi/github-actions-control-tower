name: "13 · Real ESLint Prettier and TypeScript"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: "Which real tool gate to demonstrate"
        required: true
        type: choice
        options: [G03, G04]
        default: G03
      mode:
        description: "green: valid fixture, red: style or type violation"
        required: true
        type: choice
        options: [green, red]
        default: green

permissions:
  contents: read

jobs:
  style:
    if: github.event_name == 'pull_request' || inputs.gate == 'G03'
    name: "G03 · Real ESLint + Prettier"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install exact ESLint/Prettier releases outside app dependency tree
        run: |
          npm install --prefix "$RUNNER_TEMP/quality-tools" --no-save --package-lock=false \
            --ignore-scripts --no-audit --no-fund eslint@9.39.5 prettier@3.6.2
      - name: Run actual ESLint and Prettier checks
        env:
          QUALITY_TOOL_BIN: ${{ runner.temp }}/quality-tools/node_modules/.bin
          MODE: ${{ inputs.mode || 'green' }}
        run: node scripts/quality-check.mjs G03 "$MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g03-style-${{ inputs.mode || 'green' }}
          path: reports/quality-G03-${{ inputs.mode || 'green' }}.json
          if-no-files-found: warn
          retention-days: 7

  types:
    if: github.event_name == 'pull_request' || inputs.gate == 'G04'
    name: "G04 · Real tsc --noEmit (strict DTO)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install exact TypeScript compiler outside app dependency tree
        run: |
          npm install --prefix "$RUNNER_TEMP/quality-tools" --no-save --package-lock=false \
            --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Run real strict TypeScript typecheck
        env:
          QUALITY_TOOL_BIN: ${{ runner.temp }}/quality-tools/node_modules/.bin
          MODE: ${{ inputs.mode || 'green' }}
        run: node scripts/quality-check.mjs G04 "$MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g04-types-${{ inputs.mode || 'green' }}
          path: reports/quality-G04-${{ inputs.mode || 'green' }}.json
          if-no-files-found: warn
          retention-days: 7
